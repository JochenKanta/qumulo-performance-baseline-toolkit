[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpbt"
version = "0.2.0.dev0"
description = "Qumulo Performance Baseline Toolkit (technical prototype)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7", "reportlab>=4.0,<5"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
qpbt = "qpbt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
