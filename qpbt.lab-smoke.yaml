# Funktionsprüfung - ausdrücklich KEIN performancevergleichbares Installationsprofil!
# SOURCE, Cluster-URL, CA und Mountpoints vor einem Live-Test anpassen.
schema_version: "0.2"
profile: installation-v0.2
cluster:
  api_url: "https://qumulo.example.internal:8000"
  api_token_env: "QPBT_TOKEN"
  ca_certificate: "/etc/qpbt/qumulo-ca.pem"
  node_count: null
  cache_gib_per_node: null
  node_addresses: []
targets:
  nfs:
    mountpoint: "/mnt/qpbt-nfs"
    expected_version: "4.1"
    expected_source: null # ERFORDERLICH für Live-Tests: exakter findmnt SOURCE-Wert
  smb:
    mountpoint: "/mnt/qpbt-smb"
    expected_dialect: "3.1.1"
    expected_source: null # ERFORDERLICH für Live-Tests: exakter findmnt SOURCE-Wert
network:
  enabled: true
  required: true
  ping_count: 5
workload:
  warmup_seconds: 0
  measure_seconds: 5
  worker_count: 2
  dataset_mib_per_worker: 64
  sequential_block_size: "1m"
  random_block_size: "4k"
  io_mode: direct
  metadata_file_count: 10
telemetry:
  enabled: true
  required: true
  sample_interval_seconds: 2
report:
  output_directory: "./reports"
  formats: ["json", "html", "pdf"]
safety:
  cleanup: after_report
  free_space_multiplier: 1.25
